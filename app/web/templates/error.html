{% extends "base.html" %}
{% block title %}Error {{ status }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-4 fw-bold text-muted" data-testid="error-status">{{ status }}</div>
  <p class="lead" data-testid="error-message">{{ detalle }}</p>
  <a href="/" class="btn btn-primary" data-testid="error-home">Volver al panel</a>
</div>
{% endblock %}
